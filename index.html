<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEVO SHIELD — Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #05070b;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }
        /* Ambient electric blue background glow */
        body::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: rgba(0, 240, 255, 0.07);
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        /* Smooth Entrance Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shield-icon {
            font-size: 3.8rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.6));
            animation: fadeInUp 0.8s ease forwards;
        }
        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.8rem;
            background: linear-gradient(135deg, #ffffff 40%, #00f0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.2s forwards;
        }
        p.tagline {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
            padding: 0 1rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.4s forwards;
        }
        .coming-soon-badge {
            display: inline-block;
            padding: 0.6rem 1.8rem;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            margin-bottom: 2.2rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.6s forwards;
        }
        .stores {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.8s forwards;
        }
        .store-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0d131f;
            border: 1px solid #1e293b;
            padding: 0.7rem 1.2rem;
            border-radius: 10px;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .store-btn:hover {
            border-color: rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }
        .store-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* Social Icons Section */
        .social-section {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 1s forwards;
        }
        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: #0d131f;
            border: 1px solid #1e293b;
            border-radius: 50%;
            color: #cbd5e1;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .social-icon.active:hover {
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transform: translateY(-2px);
        }
        .social-icon.inactive {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Founder Footer */
        .founder-footer {
            font-size: 0.85rem;
            color: #64748b;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 0.8s ease 1.2s forwards;
        }
        .founder-footer span {
            color: #94a3b8;
            font-weight: 600;
        }
    </style>
</head>
