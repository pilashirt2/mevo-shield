<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEVO SHIELD — World's First Proactive Web3 Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #030508;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* Dynamic 3D Background Lighting Grids */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.08) 0%, rgba(5, 7, 11, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: blur(80px);
        }

        /* 3D Immersive Wrapper Card */
        .hero-card {
            position: relative;
            z-index: 2;
            background: rgba(10, 15, 26, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            padding: 3rem 2rem;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1),
                        0 0 40px rgba(0, 240, 255, 0.05);
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out;
            animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(40px) rotateX(10deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0deg); }
        }

        /* Inbuilt 3D Embedded Logo Frame */
        .logo-frame {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 1.8rem auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d1626, #040810);
            border: 2px solid rgba(0, 240, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                        0 0 25px rgba(0, 240, 255, 0.25),
                        inset 0 2px 5px rgba(0, 240, 255, 0.3);
            animation: floatLogo 4s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        .logo-frame img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Typography with Kinetic Gradients */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 0.8rem;
            background: linear-gradient(135deg, #ffffff 30%, #00f0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 240, 255, 0.2);
        }

        p.tagline {
            font-size: 1.02rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
            font-weight: 400;
        }

        /* Elite 3D Glass Badge */
        .coming-soon-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.6rem 2rem;
            background: rgba(0, 240, 255, 0.06);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15), inset 0 0 10px rgba(0, 240, 255, 0.1);
            margin-bottom: 2.5rem;
        }

        .coming-soon-badge::before {
            content: '';
            width: 7px;
            height: 7px;
            background: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f0ff;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 15px #00f0ff; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* Store Buttons Container */
        .stores {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2.2rem;
        }

        .store-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(13, 21, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.8rem 1.4rem;
            border-radius: 14px;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .store-btn:hover {
            border-color: rgba(0, 240, 255, 0.6);
            background: rgba(0, 240, 255, 0.05);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.2);
        }

        .store-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* Social Hub */
        .social-section {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: rgba(13, 21, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            color: #cbd5e1;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .social-icon.active:hover {
            border-color: #00f0ff;
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: translateY(-4px) scale(1.05);
        }

        .social-icon.inactive {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .social-icon svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
        }

        /* Founder Footer Signature */
        .founder-footer {
            font-size: 0.8rem;
            color: #64748b;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        .founder-footer span {
            color: #00f0ff;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
    </style>
</head>
<body>

        <div class="founder-footer">
            Founder &bull; <span>Mohammad Aman Nilgar</span>
        </div>
    </div>

    <!-- 3D Interactive Motion Script -->
    <script>
        const card = document.getElementById('heroCard');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
