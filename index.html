<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEVO SHIELD — World's First Proactive Web3 Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #020408;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            position: relative;
            overflow-x: hidden;
            perspective: 1200px;
        }

        /* Deep Immersive Cyberpunk Lighting Mesh */
        body::before {
            content: '';
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(2, 4, 8, 0) 70%);
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: blur(100px);
            pointer-events: none;
        }

        /* Borderless Floating 3D Stage */
        .stage {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 700px;
            width: 100%;
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* Native 3D Sci-Fi HUD Logo Core */
        .logo-core {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            animation: coreFloat 5s ease-in-out infinite;
        }

        @keyframes coreFloat {
            0%, 100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
            50% { transform: translateY(-12px) rotateX(5deg) rotateY(-5deg); }
        }

        /* Outer Rotating Cyber Ring */
        .logo-core::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px dashed rgba(0, 240, 255, 0.4);
            animation: spinRing 15s linear infinite;
        }

        @keyframes spinRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .logo-core img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 240, 255, 0.8);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.5),
                        inset 0 0 15px rgba(0, 240, 255, 0.4);
        }

        /* True 3D Extruded Title */
        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 10%, #00f0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 15px 30px rgba(0, 240, 255, 0.4));
            transform: translateZ(40px);
            animation: textEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes textEntrance {
            from { opacity: 0; transform: translateY(30px) translateZ(0px); }
            to { opacity: 1; transform: translateY(0) translateZ(40px); }
        }

        /* Modern 3D Layered Tagline */
        p.tagline {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            line-height: 1.7;
            font-weight: 400;
            max-width: 600px;
            transform: translateZ(20px);
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        /* Cyberpunk 3D Badge */
        .coming-soon-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.7rem 2.2rem;
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1);
            margin-bottom: 2.8rem;
            backdrop-filter: blur(10px);
            transform: translateZ(25px);
        }

        .coming-soon-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00f0ff;
            animation: pulseGlow 1.5s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 20px #00f0ff; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* Action Buttons Container */
        .stores {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
            transform: translateZ(30px);
        }

        .store-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(8, 14, 26, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 0.9rem 1.6rem;
            border-radius: 16px;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
        }

        .store-btn:hover {
            border-color: rgba(0, 240, 255, 0.8);
            background: rgba(0, 240, 255, 0.08);
            color: #ffffff;
            transform: translateY(-5px) translateZ(10px);
            box-shadow: 0 15px 40px rgba(0, 240, 255, 0.3);
        }

        .store-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* Floating Social Matrix */
        .social-section {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            transform: translateZ(20px);
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: rgba(8, 14, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: #cbd5e1;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .social-icon.active:hover {
            border-color: #00f0ff;
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            transform: translateY(-5px) scale(1.1);
        }

        .social-icon.inactive {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .social-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Elite Founder Signature */
        .founder-footer {
            font-size: 0.85rem;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 1.8rem;
            width: 100%;
            max-width: 400px;
            transform: translateZ(15px);
        }

        .founder-footer span {
            color: #00f0ff;
            font-weight: 800;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>

        <div class="founder-footer">
            Founder &bull; <span>Mohammadaman Nilgar</span>
        </div>
    </div>

    <!-- 3D Parallax Motion Script -->
    <script>
        const stage = document.getElementById('stageCard');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });
        document.addEventListener('mouseleave', () => {
            stage.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
